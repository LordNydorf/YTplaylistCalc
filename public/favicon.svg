<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033"/>
      <stop offset="60%" stop-color="#FF2A55"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF0033" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="4" y="8" width="56" height="48" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Internal Highlight Ring -->
  <rect x="5.5" y="9.5" width="53" height="45" rx="14.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  
  <!-- Play Symbol -->
  <polygon points="26,20 26,44 45,32" fill="#FFFFFF" />
  
  <!-- Pulse / Speed Dot Accent -->
  <circle cx="49" cy="15" r="4" fill="#00FFA3" stroke="#07090E" stroke-width="1.5"/>
</svg>
